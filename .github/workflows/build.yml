name: NeoForge 1.21.1 Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Audit food temperature settings
        run: |
          python3 tools/check_progress_consistency.py
          python3 tools/check_thirst_tags.py
          python3 tools/check_alexscavesdelight.py
          python3 tools/check_compat_mod_ledger.py
          python3 tools/check_full_food_static_audit.py
          python3 tools/test_scan_food_candidates.py
      - name: Build and run regression checks
        run: gradle clean build check --stacktrace --no-daemon
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FoodTemperatureCompat-build
          path: build/libs/*.jar
          if-no-files-found: error
